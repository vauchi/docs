server {
    listen 80;
    server_name docs.vauchi.app;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (matching vauchi.app)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.vauchi.app; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cdn.vauchi.app; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/html image/svg+xml;
    gzip_min_length 256;

    # mdBook pages — try exact path, then /index.html fallback
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Cache static assets — fonts and images are immutable
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # JS/CSS change with deployments — short TTL with revalidation
    location ~* \.(js|css|json)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Content-aware health check. A static `return 200` here is content-
    # blind: it passes even when the web root serves nothing, so a broken
    # image deploys "successfully" and the outage is silent. Instead, serve
    # a real built file (build-info.json, generated in CI and subject to the
    # same COPY/permissions as the rest of the site). If the root is empty
    # or unreadable, try_files falls through to 503, kamal-proxy sees a
    # non-2xx health response, refuses to promote the container, and keeps
    # the last-good one — turning a silent live outage into a failed deploy.
    # See 2026-07-26 docs-404 post-mortem.
    location = /health {
        try_files /build-info.json /index.html =503;
        access_log off;
    }

    # Custom 404
    error_page 404 /404.html;
}
